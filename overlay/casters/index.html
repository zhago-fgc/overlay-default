<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Casters — Overlay (default)</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="bar">
      <div class="commentary-chip">
        <span>On commentary</span>
      </div>
      <div class="caster hidden" id="c1">
        <span class="panel-bg"></span>
        <span class="info">
          <span class="name" id="c1-name"></span>
          <span class="meta" id="c1-meta"></span>
        </span>
      </div>
      <div class="caster hidden" id="c2">
        <span class="panel-bg"></span>
        <span class="info">
          <span class="name" id="c2-name"></span>
          <span class="meta" id="c2-meta"></span>
        </span>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
